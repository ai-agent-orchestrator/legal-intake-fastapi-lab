[project]
name = "legal-intake-rag-runtime"
version = "0.1.0"
description = "Isolated Python 3.12 synthetic RAG learning runtime; no serving connection"
requires-python = ">=3.12,<3.13"
dependencies = [
    "nemoguardrails==0.24.1",
    "fastapi[standard]",
    "pydantic-settings",
    "openai",
    "pytest",
    "pytest-cov",
    "memvid-sdk==2.0.160",
    "sentence-transformers",
    "torch",
    "numpy",
]

