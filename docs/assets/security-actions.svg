<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 932 385" role="img" aria-label="9개 action: 문맥·세션, 입력, 마스킹, 용량·예산, 생성, 출력, 반환"><title>9개 action: 문맥·세션, 입력, 마스킹, 용량·예산, 생성, 출력, 반환</title><defs><marker id="arrow-security" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#adbed2"/></marker></defs><style>text{font-family:"Malgun Gothic",sans-serif;fill:#e8eff7}.cap{fill:#6bd6e8;font-size:13px}.sub{fill:#adbed2;font-size:13px}</style><g><rect x="6" y="12" width="206" height="82" rx="12" fill="#162438" stroke="#6bd6e8"/><text x="22" y="38" font-size="16" font-weight="600">01 문맥 · 세션 확인</text><text class="sub" x="22" y="60">validate_request_context</text><text class="sub" x="22" y="79">check_session_risk</text></g><g><rect x="244" y="12" width="206" height="82" rx="12" fill="#162438" stroke="#2b405b"/><text x="260" y="38" font-size="16" font-weight="600">02 입력 정책</text><text class="sub" x="260" y="60">check_input_policy</text><text class="sub" x="260" y="79">고정 규칙 · 입력 rail</text></g><path d="M212 53 L244 53" fill="none" stroke="#adbed2" stroke-width="1.5" marker-end="url(#arrow-security)"/><g><rect x="482" y="12" width="206" height="82" rx="12" fill="#162438" stroke="#2b405b"/><text x="498" y="38" font-size="16" font-weight="600">03 입력 마스킹</text><text class="sub" x="498" y="60">mask_personal_data</text><text class="sub" x="498" y="79">외부 호출 전 PII 치환</text></g><path d="M450 53 L482 53" fill="none" stroke="#adbed2" stroke-width="1.5" marker-end="url(#arrow-security)"/><g><rect x="720" y="12" width="206" height="82" rx="12" fill="#162438" stroke="#2b405b"/><text x="736" y="38" font-size="16" font-weight="600">04 용량 → 예산</text><text class="sub" x="736" y="60">check_generation_admission</text><text class="sub" x="736" y="79">check_request_budget</text></g><path d="M688 53 L720 53" fill="none" stroke="#adbed2" stroke-width="1.5" marker-end="url(#arrow-security)"/><g><rect x="720" y="165" width="206" height="82" rx="12" fill="#162438" stroke="#2b405b"/><text x="736" y="191" font-size="16" font-weight="600">05 await 생성</text><text class="sub" x="736" y="213">OpenAI async client</text><text class="sub" x="736" y="232">대기 중 다른 요청 처리</text></g><path d="M823 94 L823 165" fill="none" stroke="#adbed2" stroke-width="1.5" marker-end="url(#arrow-security)"/><g><rect x="482" y="165" width="206" height="82" rx="12" fill="#162438" stroke="#2b405b"/><text x="498" y="191" font-size="16" font-weight="600">06 출력 정책</text><text class="sub" x="498" y="213">check_output_policy</text><text class="sub" x="498" y="232">marketing 정책은 추가 검사</text></g><path d="M720 206 L688 206" fill="none" stroke="#adbed2" stroke-width="1.5" marker-end="url(#arrow-security)"/><g><rect x="244" y="165" width="206" height="82" rx="12" fill="#162438" stroke="#2b405b"/><text x="260" y="191" font-size="16" font-weight="600">07 최종 마스킹</text><text class="sub" x="260" y="213">mask_personal_data</text><text class="sub" x="260" y="232">검사한 안전 본문만 전달</text></g><path d="M482 206 L450 206" fill="none" stroke="#adbed2" stroke-width="1.5" marker-end="url(#arrow-security)"/><g><rect x="6" y="165" width="206" height="82" rx="12" fill="#162438" stroke="#2b405b"/><text x="22" y="191" font-size="16" font-weight="600">08 문맥 확인 · 응답</text><text class="sub" x="22" y="213">요청 바인딩 재확인</text><text class="sub" x="22" y="232">JSON / 검사 완료 SSE</text></g><path d="M244 206 L212 206" fill="none" stroke="#adbed2" stroke-width="1.5" marker-end="url(#arrow-security)"/><text class="sub" x="8" y="304">BLOCK → 사유 코드 확정 → record_risk_event 1회 → 안전 응답; 이후 단계 실행 금지</text><text class="sub" x="8" y="329">finally: 미종료 예약 정산·슬롯 반환. 과부하·문맥 오류는 기술 error이며 공격 점수 제외.</text><text class="sub" x="8" y="354">유료 단계마다 용량 → 예산 → 호출 → 정산 → 반환. 중첩 슬롯 획득 금지. 기본 검사는 로컬.</text></svg>