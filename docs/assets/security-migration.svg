<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1190" role="img" aria-labelledby="title desc">
<title id="title">FastAPI AI 보안 전체 이전 목표 — 인증·인가 제외</title>
<desc id="desc">구현 전 설계: 요청 문맥, 세션 위험, 입력 검사, 마스킹, 용량과 비용, AI 호출, 출력과 마케팅 검사, 안전 반환 및 실패·취소 정리.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#6bd6e8"/></marker></defs>
<style>text{font-family:'Malgun Gothic','Noto Sans KR',sans-serif;fill:#e8eff7}.label{font-size:17px;font-weight:600}.small{font-size:14px;fill:#adbed2}.cap{font-size:12px;fill:#6bd6e8;letter-spacing:1px}.link{stroke:#6bd6e8;stroke-width:2;fill:none;marker-end:url(#arrow)}.branch{stroke-dasharray:6 5}</style>
<rect width="1100" height="1190" rx="22" fill="#0e1725"/>
<text x="38" y="40" class="cap">LEGAL INTAKE / AI SECURITY MIGRATION / TARGET DESIGN</text>
<text x="38" y="78" font-size="28" font-weight="700">AI 보안은 FastAPI · Python으로</text>
<text x="38" y="107" class="small">인증·인가 제외 · 9개 action은 목표 설계 · 현재 접수 MVP와 구분</text>
<rect x="38" y="140" width="640" height="70" rx="12" fill="#162438" stroke="#294c6a"/><text x="56" y="168" class="label">01  FastAPI 진입</text><text x="56" y="192" class="small">Pydantic DTO · 요청별 context · Depends</text><path class="link" d="M358 210 V229"/><rect x="38" y="231" width="640" height="70" rx="12" fill="#162438" stroke="#294c6a"/><text x="56" y="259" class="label">02  validate_request_context</text><text x="56" y="283" class="small">요청·대상 snapshot 바인딩 확인</text><path class="link" d="M358 301 V320"/><rect x="38" y="322" width="640" height="70" rx="12" fill="#162438" stroke="#294c6a"/><text x="56" y="350" class="label">03  check_session_risk · check_input_policy</text><text x="56" y="374" class="small">누적 위험·고정 입력 정책 검사</text><path class="link" d="M358 392 V411"/><rect x="38" y="413" width="640" height="70" rx="12" fill="#162438" stroke="#294c6a"/><text x="56" y="441" class="label">04  mask_personal_data</text><text x="56" y="465" class="small">저장·AI 전송 전에 정의한 개인정보 패턴 치환</text><path class="link" d="M358 483 V502"/><rect x="38" y="504" width="640" height="70" rx="12" fill="#162438" stroke="#294c6a"/><text x="56" y="532" class="label">05  check_generation_admission</text><text x="56" y="556" class="small">유한 대기열 · 생성 용량 확보</text><path class="link" d="M358 574 V593"/><rect x="38" y="595" width="640" height="70" rx="12" fill="#162438" stroke="#294c6a"/><text x="56" y="623" class="label">06  check_request_budget</text><text x="56" y="647" class="small">확인+예약 원자 처리 · 초과 시 AI 호출 중단</text><path class="link" d="M358 665 V684"/><rect x="38" y="686" width="640" height="70" rx="12" fill="#162438" stroke="#294c6a"/><text x="56" y="714" class="label">07  await OpenAI</text><text x="56" y="738" class="small">호출 후 비용 정산 · 생성 슬롯 반환</text><path class="link" d="M358 756 V775"/><rect x="38" y="777" width="640" height="70" rx="12" fill="#162438" stroke="#294c6a"/><text x="56" y="805" class="label">08  check_output_policy</text><text x="56" y="829" class="small">완성 답변 전체 검사 · 장애 시 공개 중단</text><path class="link" d="M358 847 V866"/><rect x="38" y="868" width="640" height="70" rx="12" fill="#162438" stroke="#294c6a"/><text x="56" y="896" class="label">09  check_marketing_response</text><text x="56" y="920" class="small">M01/M02 필수 · 보장·과장 문구 → 사람 검토</text><path class="link" d="M358 938 V957"/><rect x="38" y="959" width="640" height="70" rx="12" fill="#162438" stroke="#294c6a"/><text x="56" y="987" class="label">10  최종 마스킹 · 응답 문맥 재확인</text><text x="56" y="1011" class="small">검사 완료 safeText만 JSON / 안전 SSE로 반환</text><rect x="718" y="140" width="344" height="70" rx="12" fill="#162438" stroke="#294c6a"/><text x="736" y="168" class="label">범위</text><text x="736" y="192" class="small">로그인 · JWT · 역할 권한 제외</text><rect x="718" y="257" width="344" height="70" rx="12" fill="#162438" stroke="#294c6a"/><text x="736" y="285" class="label">record_risk_event</text><text x="736" y="309" class="small">확정 정책 차단만 중복 없이 기록</text><path class="link branch" d="M678 357 H698 V292 H716"/><text x="730" y="349" class="small">기술 오류·과부하·REVIEW는</text><text x="730" y="371" class="small">공격 점수에 적립하지 않음</text><rect x="718" y="467" width="344" height="70" rx="12" fill="#162438" stroke="#9a7244"/><text x="736" y="495" class="label">서비스 finally</text><text x="736" y="519" class="small">실패·timeout·취소에도 정리</text><text x="736" y="563" class="small">미종료 예약 정산 · lease 반환</text><text x="736" y="586" class="small">네트워크 대기 중 lock 유지 금지</text><path class="link branch" d="M678 721 H698 V502 H716"/><rect x="718" y="649" width="344" height="70" rx="12" fill="#162438" stroke="#294c6a"/><text x="736" y="677" class="label">각 유료 단계의 경계</text><text x="736" y="701" class="small">용량 → 예약 → 호출 → 정산 → 반환</text><rect x="718" y="787" width="344" height="70" rx="12" fill="#162438" stroke="#294c6a"/><text x="736" y="815" class="label">우선 학습할 3개</text><text x="736" y="839" class="small">마스킹 · 예산 · 마케팅 검사</text><text x="736" y="884" class="small">나머지 6개도 이전 목표에 포함</text><text x="736" y="907" class="small">데코레이터 등록만으로 완료 아님</text><rect x="38" y="1070" width="1024" height="85" rx="12" fill="#142d35" stroke="#3a6c73"/>
<text x="58" y="1099" class="label">현재 완료: 동기 접수 등록·조회 + 비동기 AI 안내 · 테스트 23개</text>
<text x="58" y="1126" class="small">다음: 기반 부품 → 9개 action·NeMo rail → AI pipeline → 실호출 → 법률 게시판·SSE</text>
