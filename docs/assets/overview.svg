<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 932 420" role="img" aria-label="FastAPI 전체 흐름: ASGI 진입 후 AI, 규칙, 게시판 서비스로 분기"><title>FastAPI 전체 흐름: ASGI 진입 후 AI, 규칙, 게시판 서비스로 분기</title><defs><marker id="arrow-overview" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#adbed2"/></marker></defs><style>text{font-family:"Malgun Gothic",sans-serif;fill:#e8eff7}.cap{fill:#6bd6e8;font-size:13px}.sub{fill:#adbed2;font-size:13px}</style><g><rect x="336" y="5" width="260" height="65" rx="12" fill="#162438" stroke="#6bd6e8"/><text x="352" y="31" font-size="16" font-weight="600">Swagger · 브라우저</text><text class="sub" x="352" y="53">로컬 단일 사용자 · 합성 데이터</text></g><path d="M466 70 L466 92" fill="none" stroke="#adbed2" stroke-width="1.5" marker-end="url(#arrow-overview)"/><g><rect x="336" y="94" width="260" height="65" rx="12" fill="#162438" stroke="#6bd6e8"/><text x="352" y="120" font-size="16" font-weight="600">ASGI → FastAPI</text><text class="sub" x="352" y="142">trace → Pydantic → Depends</text></g><path d="M466 159 L136 204" fill="none" stroke="#adbed2" stroke-width="1.5" marker-end="url(#arrow-overview)"/><g><rect x="6" y="208" width="260" height="82" rx="12" fill="#162438" stroke="#6bd6e8"/><text x="22" y="234" font-size="16" font-weight="600">비동기 챗봇 · AI</text><text class="sub" x="22" y="256">S01·S02 / M01·M02</text><text class="sub" x="22" y="275">async def → await AI·NeMo</text></g><path d="M136 290 L136 322" fill="none" stroke="#adbed2" stroke-width="1.5" marker-end="url(#arrow-overview)"/><path d="M466 159 L466 204" fill="none" stroke="#adbed2" stroke-width="1.5" marker-end="url(#arrow-overview)"/><g><rect x="336" y="208" width="260" height="82" rx="12" fill="#162438" stroke="#2b405b"/><text x="352" y="234" font-size="16" font-weight="600">규칙 · 법률 참조</text><text class="sub" x="352" y="256">C02·C04 / R01·R02·R06</text><text class="sub" x="352" y="275">고정 fixture · 유료 호출 없음</text></g><path d="M466 290 L466 322" fill="none" stroke="#adbed2" stroke-width="1.5" marker-end="url(#arrow-overview)"/><path d="M466 159 L796 204" fill="none" stroke="#adbed2" stroke-width="1.5" marker-end="url(#arrow-overview)"/><g><rect x="666" y="208" width="260" height="82" rx="12" fill="#162438" stroke="#2b405b"/><text x="682" y="234" font-size="16" font-weight="600">비동기 게시판 · 리뷰</text><text class="sub" x="682" y="256">B01~B07 / C13</text><text class="sub" x="682" y="275">async def · 비동기 저장 경계</text></g><path d="M796 290 L796 322" fill="none" stroke="#adbed2" stroke-width="1.5" marker-end="url(#arrow-overview)"/><g><rect x="6" y="326" width="260" height="82" rx="12" fill="#162438" stroke="#2b405b"/><text x="22" y="352" font-size="16" font-weight="600">NeMo + OpenAI</text><text class="sub" x="22" y="374">입출력 rail만 · 비동기 호출</text><text class="sub" x="22" y="393">전체 검사 → JSON / SSE</text></g><g><rect x="336" y="326" width="260" height="82" rx="12" fill="#162438" stroke="#2b405b"/><text x="352" y="352" font-size="16" font-weight="600">응답 모델</text><text class="sub" x="352" y="374">camelCase · 오류 계약</text><text class="sub" x="352" y="393">규칙 결과와 고정 안내</text></g><g><rect x="666" y="326" width="260" height="82" rx="12" fill="#162438" stroke="#2b405b"/><text x="682" y="352" font-size="16" font-weight="600">메모리 저장소</text><text class="sub" x="682" y="374">마스킹 · 짧은 async lock</text><text class="sub" x="682" y="393">AI에는 불변 snapshot 전달</text></g></svg>