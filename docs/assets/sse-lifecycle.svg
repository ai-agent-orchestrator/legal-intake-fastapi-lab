<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 932 385" role="img" aria-label="SSE 출력과 예약 상태 전이"><title>SSE 출력과 예약 상태 전이</title><defs><marker id="arrow-sse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#adbed2"/></marker></defs><style>text{font-family:"Malgun Gothic",sans-serif;fill:#e8eff7}.cap{fill:#6bd6e8;font-size:13px}.sub{fill:#adbed2;font-size:13px}</style><g><rect x="6" y="12" width="206" height="82" rx="12" fill="#162438" stroke="#6bd6e8"/><text x="22" y="38" font-size="16" font-weight="600">01 meta</text><text class="sub" x="22" y="60">서버 traceId · model</text><text class="sub" x="22" y="79">본문과 개인정보 없음</text></g><g><rect x="244" y="12" width="206" height="82" rx="12" fill="#162438" stroke="#2b405b"/><text x="260" y="38" font-size="16" font-weight="600">02 문맥 · 입력 검사</text><text class="sub" x="260" y="60">마스킹 → 용량 → 예산</text><text class="sub" x="260" y="79">정책 차단이면 blocked 종료</text></g><path d="M212 53 L244 53" fill="none" stroke="#adbed2" stroke-width="1.5" marker-end="url(#arrow-sse)"/><g><rect x="482" y="12" width="206" height="82" rx="12" fill="#162438" stroke="#2b405b"/><text x="498" y="38" font-size="16" font-weight="600">03 await 전체 생성</text><text class="sub" x="498" y="60">사용량 확인 · 정산</text><text class="sub" x="498" y="79">미확인 사용량은 추정 정산</text></g><path d="M450 53 L482 53" fill="none" stroke="#adbed2" stroke-width="1.5" marker-end="url(#arrow-sse)"/><g><rect x="720" y="12" width="206" height="82" rx="12" fill="#162438" stroke="#2b405b"/><text x="736" y="38" font-size="16" font-weight="600">04 전체 출력 검사</text><text class="sub" x="736" y="60">마케팅 검사 · 최종 마스킹</text><text class="sub" x="736" y="79">검사 실패 시 본문 전송 없음</text></g><path d="M688 53 L720 53" fill="none" stroke="#adbed2" stroke-width="1.5" marker-end="url(#arrow-sse)"/><g><rect x="720" y="165" width="206" height="82" rx="12" fill="#162438" stroke="#2b405b"/><text x="736" y="191" font-size="16" font-weight="600">05 token 이벤트</text><text class="sub" x="736" y="213">검사 완료 문장을 청크로</text><text class="sub" x="736" y="232">실시간 미검사 토큰 아님</text></g><path d="M823 94 L823 165" fill="none" stroke="#adbed2" stroke-width="1.5" marker-end="url(#arrow-sse)"/><g><rect x="482" y="165" width="206" height="82" rx="12" fill="#162438" stroke="#2b405b"/><text x="498" y="191" font-size="16" font-weight="600">06 done</text><text class="sub" x="498" y="213">usageAvailable / costSource</text><text class="sub" x="498" y="232">정상 terminal 1회</text></g><path d="M720 206 L688 206" fill="none" stroke="#adbed2" stroke-width="1.5" marker-end="url(#arrow-sse)"/><g><rect x="244" y="165" width="206" height="82" rx="12" fill="#162438" stroke="#2b405b"/><text x="260" y="191" font-size="16" font-weight="600">별도: 단절 · 오류</text><text class="sub" x="260" y="213">취소 + bounded cleanup</text><text class="sub" x="260" y="232">error / blocked 후 done 없음</text></g><g><rect x="6" y="165" width="206" height="82" rx="12" fill="#162438" stroke="#2b405b"/><text x="22" y="191" font-size="16" font-weight="600">예산: OPEN → 1회</text><text class="sub" x="22" y="213">REPORTED / ESTIMATED</text><text class="sub" x="22" y="232">호출 전 취소는 RELEASED</text></g><text class="sub" x="8" y="304">윗줄은 왼쪽 → 오른쪽, 아랫줄은 오른쪽 → 왼쪽. 단절·예산 카드는 별도 종료 규칙이다.</text><text class="sub" x="8" y="329">SSE 시작 전: 422/503/504 가능. 시작 후: HTTP 상태 변경 대신 error 이벤트.</text><text class="sub" x="8" y="354">POST 스트림은 fetch ReadableStream 사용. BackgroundTasks로 필수 검사·정산을 미루지 않는다.</text></svg>